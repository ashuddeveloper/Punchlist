name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux in about a second. Catches query-plan regressions and
  # accidental networking in the core on every push, without waiting for a
  # macOS runner to be allocated.
  invariants:
    name: Schema and offline invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hot-path query plans and offline purity
        run: node tools/schema-check/check.mjs

  core:
    name: PunchlistCore (build + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  # PunchlistCore is platform-agnostic by design — it imports no Apple UI
  # framework. Building it on Linux is how that stays true: the day someone
  # adds `import UIKit` to a repository, this job fails.
  core-linux:
    name: PunchlistCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
